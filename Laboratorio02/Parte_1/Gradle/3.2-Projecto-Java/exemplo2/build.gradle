apply plugin: 'java'
apply plugin: 'application'

archivesBaseName = "quote"
version = '1.0-FINAL'

repositories {
    mavenCentral()
}

dependencies {
    compile group: 'org.apache.commons', name: 'commons-lang3', version: '3.3.2'
    testCompile group: 'junit', name: 'junit', version: '4.+'
}

mainClassName = 'ao.co.isptec.aplm.quote.Quote'
